<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quản lý sinh viên</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-bottom: 8px;
            color: #34495e;
        }

        input {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #3498db;
        }

        .button-container {
            grid-column: 1 / -1;
            text-align: center;
            margin-top: 10px;
        }

        button {
            background: #3498db;
            color: white;
            border: none;
            padding: 12px 35px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #2980b9;
        }

        .result {
            margin-top: 35px;
        }

        .result h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
        }

        .cards {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            width: 180px;
            padding: 20px;
            text-align: center;
            background: #f8f9fa;
            border-radius: 12px;
            border: 1px solid #ddd;
        }

        .card .label {
            color: #666;
            font-size: 15px;
            margin-bottom: 8px;
        }

        .card .number {
            font-size: 30px;
            font-weight: bold;
            color: #2c3e50;
        }

        .chart {
            text-align: center;
            margin-top: 20px;
        }

        .chart img {
            max-width: 100%;
            border-radius: 10px;
            border: 1px solid #ddd;
}

        @media (max-width: 600px) {
            form {
                grid-template-columns: 1fr;
            }

            .button-container {
                grid-column: 1;
            }

            .cards {
                flex-direction: column;
                align-items: center;
            }

            .container {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>📚 Quản lý sinh viên</h1>

    <p class="subtitle">
        Nhập số lượng sinh viên nam và nữ trong lớp
    </p>

    <form method="POST">

        <div class="form-group">
            <label for="male">👨 Số sinh viên nam</label>

            <input
                type="number"
                id="male"
                name="male"
                min="0"
                required
                placeholder="Nhập số lượng nam"
            >
        </div>

        <div class="form-group">
            <label for="female">👩 Số sinh viên nữ</label>

            <input
                type="number"
                id="female"
                name="female"
                min="0"
                required
                placeholder="Nhập số lượng nữ"
            >
        </div>

        <div class="button-container">
            <button type="submit">
                📊 Hiển thị biểu đồ
            </button>
        </div>

    </form>

    {% if male is not none and female is not none %}

    <div class="result">

        <h2>Kết quả</h2>

        <div class="cards">

            <div class="card">
                <div class="label">👨 Nam</div>
                <div class="number">{{ male }}</div>
            </div>

            <div class="card">
                <div class="label">👩 Nữ</div>
                <div class="number">{{ female }}</div>
            </div>

        </div>

        <div class="chart">
            <img
                src="{{ url_for('static', filename='chart.png') }}"
                alt="Biểu đồ số lượng sinh viên nam và nữ"
            >
        </div>

    </div>

    {% endif %}

</div>

</body>
</html>
